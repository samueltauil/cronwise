name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - name: Unit tests
        run: npm test
      - name: Smoke test
        run: |
          npm start &
          sleep 3
          curl -sf "http://localhost:3000/health"
          curl -sf -G "http://localhost:3000/explain" --data-urlencode "expression=30 9 * * 1-5"
